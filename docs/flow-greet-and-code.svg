<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1060" viewBox="0 0 1480 1060" font-family="Microsoft YaHei, PingFang SC, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f87171"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#34d399"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1480" height="1060" fill="#0f1420"/>

  <text x="740" y="42" text-anchor="middle" fill="#e5e7eb" font-size="22" font-weight="600">job-scout 招呼语与代码分析：现状 → 改造</text>
  <text x="740" y="66" text-anchor="middle" fill="#64748b" font-size="13">蓝=LLM 调用　绿=改造后　红=问题点　紫=可选阶段</text>

  <!-- ============ 左栏：现状 ============ -->
  <text x="60" y="108" fill="#94a3b8" font-size="15" font-weight="600">现状：串行三次 LLM，每次重新理解上下文</text>

  <rect x="60" y="128" width="200" height="44" rx="8" fill="#1e293b" stroke="#475569" filter="url(#shadow)"/>
  <text x="160" y="155" text-anchor="middle" fill="#e5e7eb" font-size="13">用户点「生成招呼语」</text>

  <line x1="160" y1="172" x2="160" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="196" width="200" height="56" rx="8" fill="#172033" stroke="#3b82f6" filter="url(#shadow)"/>
  <text x="160" y="218" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="600">① match_job</text>
  <text x="160" y="238" text-anchor="middle" fill="#94a3b8" font-size="11">简历 + JD 全文 → 分数</text>

  <line x1="160" y1="252" x2="160" y2="276" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="276" width="200" height="56" rx="8" fill="#172033" stroke="#3b82f6" filter="url(#shadow)"/>
  <text x="160" y="298" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="600">② rewrite_resume</text>
  <text x="160" y="318" text-anchor="middle" fill="#94a3b8" font-size="11">简历 + JD + 代码摘要 → 建议</text>

  <line x1="160" y1="332" x2="160" y2="356" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="356" width="200" height="56" rx="8" fill="#172033" stroke="#3b82f6" filter="url(#shadow)"/>
  <text x="160" y="378" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="600">③ generate_greeting</text>
  <text x="160" y="398" text-anchor="middle" fill="#94a3b8" font-size="11">JD核心 + brief + 简历 → 招呼语</text>

  <line x1="160" y1="412" x2="160" y2="436" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="436" width="200" height="44" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="160" y="463" text-anchor="middle" fill="#e5e7eb" font-size="12">超过 210 字？</text>

  <line x1="260" y1="458" x2="300" y2="458" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="280" y="452" text-anchor="middle" fill="#f87171" font-size="10">是</text>
  <line x1="300" y1="458" x2="300" y2="384" stroke="#f87171" stroke-width="1.5"/>
  <line x1="300" y1="384" x2="262" y2="384" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="330" y="422" fill="#f87171" font-size="10">重试 1 次</text>

  <line x1="160" y1="480" x2="160" y2="504" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="60" y="504" width="200" height="40" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="160" y="529" text-anchor="middle" fill="#e5e7eb" font-size="12">返回招呼语</text>

  <!-- 现状问题 -->
  <text x="60" y="588" fill="#f87171" font-size="14" font-weight="600">现状的三个问题</text>

  <rect x="60" y="602" width="370" height="76" rx="8" fill="#2a1416" stroke="#f87171" stroke-opacity="0.5"/>
  <text x="76" y="624" fill="#fca5a5" font-size="12" font-weight="600">① 信息三次衰减</text>
  <text x="76" y="645" fill="#94a3b8" font-size="11">match 的结论压成一句 → rewrite 再压 → greet 只剩 brief</text>
  <text x="76" y="663" fill="#94a3b8" font-size="11">三次都重新读 JD 和简历，重点可能各不相同</text>

  <rect x="60" y="690" width="370" height="76" rx="8" fill="#2a1416" stroke="#f87171" stroke-opacity="0.5"/>
  <text x="76" y="712" fill="#fca5a5" font-size="12" font-weight="600">② 没有自我检查</text>
  <text x="76" y="733" fill="#94a3b8" font-size="11">生成完直接返回，出现「重复表达」「编造转正承诺」也没人管</text>
  <text x="76" y="751" fill="#94a3b8" font-size="11">实测那版里「用 LangGraph」连着说了两遍</text>

  <rect x="60" y="778" width="370" height="76" rx="8" fill="#2a1416" stroke="#f87171" stroke-opacity="0.5"/>
  <text x="76" y="800" fill="#fca5a5" font-size="12" font-weight="600">③ 代码只看到碎片</text>
  <text x="76" y="821" fill="#94a3b8" font-size="11">固定抽 5 个文件 × 前 120 行，模型看不到调用链</text>
  <text x="76" y="839" fill="#94a3b8" font-size="11">读到 match.py 也不会去读它调用的 rewrite_resume 实现</text>

  <!-- ============ 右栏 ============ -->
  <text x="520" y="108" fill="#94a3b8" font-size="15" font-weight="600">改造后：扫描慢一次，日常快且准</text>

  <!-- 阶段一 -->
  <rect x="520" y="128" width="900" height="196" rx="10" fill="#12261e" stroke="#34d399" stroke-opacity="0.4"/>
  <text x="540" y="152" fill="#34d399" font-size="13" font-weight="600">阶段一 · 扫描项目（只做一次，40–90 秒）</text>

  <rect x="540" y="168" width="150" height="44" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="615" y="188" text-anchor="middle" fill="#e5e7eb" font-size="12">项目目录</text>
  <text x="615" y="203" text-anchor="middle" fill="#64748b" font-size="10">scan_project</text>

  <line x1="690" y1="190" x2="726" y2="190" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="726" y="160" width="330" height="112" rx="8" fill="#0f2a20" stroke="#34d399"/>
  <text x="746" y="182" fill="#6ee7b7" font-size="12" font-weight="600">ReAct 循环（模型自主读代码）</text>
  <text x="746" y="204" fill="#94a3b8" font-size="11">🔧 list_dir  —— 列目录看结构</text>
  <text x="746" y="224" fill="#94a3b8" font-size="11">🔧 read_file —— 读全文 / 指定行段</text>
  <text x="746" y="244" fill="#94a3b8" font-size="11">🔧 grep      —— 搜符号追调用链</text>
  <text x="746" y="264" fill="#64748b" font-size="10">最多 8 轮 / 20 次调用 / 只读沙箱</text>

  <line x1="1056" y1="190" x2="1092" y2="190" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="1092" y="168" width="170" height="60" rx="8" fill="#1e293b" stroke="#34d399"/>
  <text x="1177" y="190" text-anchor="middle" fill="#6ee7b7" font-size="12">项目摘要</text>
  <text x="1177" y="208" text-anchor="middle" fill="#94a3b8" font-size="10">介绍 + 模块 + 亮点</text>
  <text x="1177" y="222" text-anchor="middle" fill="#64748b" font-size="10">存 data/code/*.json</text>

  <text x="540" y="300" fill="#64748b" font-size="11">↑ 这一步慢没关系，摘要是一次性产物，之后都读缓存</text>

  <!-- 阶段二 -->
  <rect x="520" y="344" width="900" height="240" rx="10" fill="#131f2e" stroke="#60a5fa" stroke-opacity="0.4"/>
  <text x="540" y="368" fill="#60a5fa" font-size="13" font-weight="600">阶段二 · 生成招呼语（每次，约 12–15 秒）</text>

  <rect x="540" y="386" width="170" height="52" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="625" y="408" text-anchor="middle" fill="#e5e7eb" font-size="12">输入</text>
  <text x="625" y="426" text-anchor="middle" fill="#64748b" font-size="10">JD核心 + 简历 + 摘要</text>

  <line x1="710" y1="412" x2="746" y2="412" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="746" y="378" width="220" height="68" rx="8" fill="#172033" stroke="#3b82f6"/>
  <text x="856" y="400" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">一次 LLM 输出三样</text>
  <text x="856" y="418" text-anchor="middle" fill="#94a3b8" font-size="10">match + rewrite + greeting</text>
  <text x="856" y="434" text-anchor="middle" fill="#64748b" font-size="10">共享同一份理解，不再衰减</text>

  <line x1="966" y1="412" x2="1002" y2="412" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1002" y="386" width="150" height="52" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="1077" y="408" text-anchor="middle" fill="#e5e7eb" font-size="12">自评打分</text>
  <text x="1077" y="426" text-anchor="middle" fill="#64748b" font-size="10">重复/编造/具体度</text>

  <line x1="1152" y1="412" x2="1188" y2="412" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1188" y="386" width="200" height="52" rx="8" fill="#1e293b" stroke="#34d399"/>
  <text x="1288" y="408" text-anchor="middle" fill="#6ee7b7" font-size="12">≥4 分就返回</text>
  <text x="1288" y="426" text-anchor="middle" fill="#64748b" font-size="10">&lt;4 分 → 带批评重写一次</text>

  <path d="M1288 438 L1288 468 L856 468 L856 448" fill="none" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="1072" y="484" text-anchor="middle" fill="#f87171" font-size="10">不合格 → 重写（最多 1 次）</text>

  <text x="540" y="534" fill="#64748b" font-size="11">↑ 30.8 秒 → 12–15 秒，质量更高（少了两次重新理解上下文）</text>

  <!-- 阶段三 -->
  <rect x="520" y="602" width="900" height="118" rx="10" fill="#1f1a2e" stroke="#a78bfa" stroke-opacity="0.4"/>
  <text x="540" y="626" fill="#c4b5fd" font-size="13" font-weight="600">阶段三 · 可选：/ask 问答改成 ReAct（LangGraph 真正有用的地方）</text>

  <rect x="540" y="642" width="180" height="56" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="630" y="664" text-anchor="middle" fill="#e5e7eb" font-size="12">用户提问</text>
  <text x="630" y="682" text-anchor="middle" fill="#64748b" font-size="10">「我该投哪个」</text>

  <line x1="720" y1="670" x2="756" y2="670" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <rect x="756" y="638" width="380" height="64" rx="8" fill="#211a33" stroke="#a78bfa"/>
  <text x="776" y="660" fill="#c4b5fd" font-size="11" font-weight="600">模型自己决定下一步调哪个工具</text>
  <text x="776" y="678" fill="#94a3b8" font-size="10">search_jobs / company_profile / prep_advice / code_review</text>
  <text x="776" y="694" fill="#64748b" font-size="10">多轮：查岗位 → 发现公司 → 查画像 → 综合回答</text>

  <line x1="1136" y1="670" x2="1172" y2="670" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <rect x="1172" y="642" width="216" height="56" rx="8" fill="#1e293b" stroke="#a78bfa"/>
  <text x="1280" y="664" text-anchor="middle" fill="#c4b5fd" font-size="12">带引用的回答</text>
  <text x="1280" y="682" text-anchor="middle" fill="#64748b" font-size="10">这才是 LangGraph 的场景</text>

  <!-- 分工：右下三栏 -->
  <text x="540" y="762" fill="#94a3b8" font-size="14" font-weight="600">分工建议</text>

  <rect x="520" y="778" width="288" height="130" rx="8" fill="#1a2333" stroke="#60a5fa" stroke-opacity="0.5"/>
  <text x="540" y="802" fill="#60a5fa" font-size="13" font-weight="600">你来做 · 前端 + 验收</text>
  <text x="540" y="826" fill="#94a3b8" font-size="11">· 文件夹选择器进新目录能不能点</text>
  <text x="540" y="846" fill="#94a3b8" font-size="11">· ReAct 扫描时显示「正在读 main.py…」</text>
  <text x="540" y="866" fill="#94a3b8" font-size="11">· 老/新招呼语对比，标出不满意处</text>
  <text x="540" y="886" fill="#94a3b8" font-size="11">· 在 /ask 里试 ReAct 搜多轮</text>

  <rect x="826" y="778" width="288" height="130" rx="8" fill="#12261e" stroke="#34d399" stroke-opacity="0.5"/>
  <text x="846" y="802" fill="#34d399" font-size="13" font-weight="600">我来做 · 后端 + 工具</text>
  <text x="846" y="826" fill="#94a3b8" font-size="11">· ReAct 三件套 + 只读沙箱</text>
  <text x="846" y="846" fill="#94a3b8" font-size="11">· 一次输出 match+rewrite+greet</text>
  <text x="846" y="866" fill="#94a3b8" font-size="11">· 自评 prompt + 重写循环</text>
  <text x="846" y="886" fill="#94a3b8" font-size="11">· /ask 的 LangGraph ReAct 图</text>

  <rect x="1132" y="778" width="288" height="130" rx="8" fill="#241f14" stroke="#fbbf24" stroke-opacity="0.5"/>
  <text x="1152" y="802" fill="#fbbf24" font-size="13" font-weight="600">先一起拍板</text>
  <text x="1152" y="826" fill="#94a3b8" font-size="11">· ReAct 最多几轮？超了怎么降级？</text>
  <text x="1152" y="846" fill="#94a3b8" font-size="11">· 招呼语自评阈值定几分？</text>
  <text x="1152" y="866" fill="#94a3b8" font-size="11">· 扫描超时算失败还是存部分？</text>
  <text x="1152" y="886" fill="#94a3b8" font-size="11">· 要不要给用户看「模型读了哪些文件」</text>

  <!-- 底部提示 -->
  <text x="740" y="944" text-anchor="middle" fill="#475569" font-size="11">先做阶段二（1 小时，见效快），再做阶段一（2 小时），阶段三看心情</text>
</svg>
