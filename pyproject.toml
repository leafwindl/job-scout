[project]
name = "job-scout"
version = "0.1.0"
description = "招聘信息采集与分析 Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "playwright>=1.48",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "rich>=13.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "numpy>=2.4.6",
    "fastembed>=0.9.1",
    "openai>=3.40.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "sse-starlette>=3.6.0",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.33",
]

[project.scripts]
job-scout = "job_scout.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_scout"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
